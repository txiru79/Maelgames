<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#1b2a41;color:#fdf6e3;font-family:"Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
.gold{background:#b9770e!important;border-color:#f4c95d!important}
#lv{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.lb{opacity:.55;padding:8px 14px}.lb.on{opacity:1}
#md{margin:18px 0 30px;font-size:.9rem;line-height:1.7;color:#f4c95d}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#f4c95d;color:#1b2a41;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center}
.in{width:80%;padding:12px;border-radius:10px;border:2px solid #f4c95d;background:#243b5a;color:#fdf6e3;font:inherit;text-align:center;user-select:text;-webkit-user-select:text}
.box{background:#243b5a;border:2px solid #fdf6e3;border-radius:12px;padding:8px 12px;margin:8px auto;max-width:360px;text-align:center}
#bar .btn{padding:8px 11px}
#title{font-size:.85rem;text-align:center;flex:1}
.hd{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0 22px}
.av{width:104px;height:104px;border:5px solid #f4c95d;border-radius:8px;box-shadow:5px 5px 0 #2f7d4f;display:block;background:#fdf6e3}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.lg svg{width:72px;height:auto;display:block;shape-rendering:crispEdges}
.nm,.gm{font-family:"Press Start 2P","Courier New",monospace;font-weight:700;line-height:1.1}
.nm{font-size:1.5rem;color:#fdf6e3;text-shadow:3px 3px 0 #2f7d4f}
.gm{font-size:1rem;color:#f4c95d;text-shadow:2px 2px 0 #2f7d4f}
#menu{max-width:480px;margin:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#243b5a;border:3px solid #fdf6e3;border-radius:22px 22px 22px 6px;padding:18px 8px;color:inherit;font:inherit;text-align:center}
.card:active{transform:scale(.96)}
.card i{font-size:48px;font-style:normal;display:block}
.card b{display:block;font-size:1.1rem;margin-top:6px}
.card small{display:block;color:#f4c95d;margin-top:6px;line-height:1.4}
#game{display:flex;flex-direction:column;height:100%;max-width:480px;margin:auto}
#bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 4px}
#info{text-align:center;color:#f4c95d;min-height:1.5em;padding-bottom:6px}
.btn{background:#f4c95d;color:#1b2a41;border:0;border-radius:12px;padding:10px 20px;font:700 1rem "Trebuchet MS",system-ui,sans-serif}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12px}
canvas{display:block;border-radius:14px;touch-action:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.hole{aspect-ratio:1;font-size:clamp(40px,14vw,64px);background:#4a3320;border:4px solid #6b4a2e;border-radius:50%;padding:0}
.goal{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border:6px solid #fdf6e3;border-bottom:0;background:#2f7d4f;border-radius:8px 8px 0 0}
.zone{height:150px;background:none;border:1px dashed #ffffff66;font-size:56px;color:inherit}
.msg{margin-top:20px;font-size:1.3rem;text-align:center;min-height:2em}
.ov{position:absolute;inset:0;background:#1b2a41ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border-radius:14px;font-size:1.3rem;padding:20px}
</style>
</head>

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),G={};
const N={
  caca:['💩','Pisa la caca','Toca las cacas antes de que se escondan'],
  rana:['🐸','Salta la rana','Toca para saltar los troncos'],
  futbol:['⚽','Fútbol','Desliza el dedo para chutar, el portero se mueve'],
  tenis:['🎾','Tenis','Arrastra la pala, gana a 5'],
  tenis2:['🎾','Tenis 2 jugadores','Uno arriba y otro abajo'],
  memoria:['🧠','Memoria','Encuentra las parejas'],
  tres:['❌','Tres en raya','Gana a la CPU'],
  ppt:['✂️','Piedra papel tijera','Gana a 5'],
  flappy:['🐤','Pájaro volador','Toca para aletear y pasar entre las tuberías'],
  coches:['🏎️','Esquiva coches','Toca izquierda o derecha para cambiar de carril'],
  bandera:['🏳️','Adivina la bandera','Elige continente y adivina el país de cada bandera'],
  bolos:['🎳','Bolos','Toca cuando la bola esté en el centro'],
  serpiente:['🐍','Serpiente','Desliza el dedo para girar y come manzanas'],
  capitales:['🏛️','Capitales','Elige continente y adivina la capital']
};
let cur='',stopFn=null;
const getBest=k=>{try{return +localStorage.getItem('mj_'+k)||0}catch(e){return 0}};
const setBest=(k,v)=>{try{localStorage.setItem('mj_'+k,v)}catch(e){}};
const info=t=>$('#info').textContent=t;
let ac,mute=false;
const ctx=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac};
function snd(f,d=.1,ty='square',v=.15,f2){
  if(mute)return;
  try{
    const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type=ty;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const seq=(a,ty='square')=>a.forEach(([f,d,w])=>setTimeout(()=>snd(f,d,ty,.15),w));
function toggleMute(){mute=!mute;$('#mt').textContent=mute?'🔇':'🔊'}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let lvl=1;try{const v=localStorage.getItem('mj_lv');if(v!==null)lvl=+v}catch(e){}
const dm=()=>[.75,1,1.3][lvl];
function setLv(i){lvl=i;try{localStorage.setItem('mj_lv',i)}catch(e){}menu()}
let paused=false,duo=null,mus=null,mOn=false;
const DG=[['caca',25],['rana',80],['futbol',4],['memoria',16],['flappy',5],['coches',15],['bandera',7],['bolos',30],['serpiente',10]];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const coins=()=>ls('mj_c',0),addC=n=>sv('mj_c',coins()+n);
const getDone=()=>ls('mj_dd',null),setDone=k=>sv('mj_dd',k);
const getSeen=()=>ls('mj_seen',{});
const skin=()=>ls('mj_sk','face');
const SK={face:[0,'Máel'],'🐸':[0,'Rana'],'🦊':[30,'Zorro'],'🐱':[30,'Gato'],'🤖':[50,'Robot'],'🟩':[60,'Creeper'],'🦄':[80,'Unicornio'],'🐲':[100,'Dragón'],'🧟':[100,'Zombi']};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function daily(){const k=new Date().toISOString().slice(0,10);const n=[...k].reduce((a,c)=>a+c.charCodeAt(0),0);const d=DG[n%DG.length];return{k,g:d[0],t:d[1]}}
function topUI(){
  const d=daily();
  $('#top').innerHTML=`<div class="box">🪙 ${coins()} monedas</div><div class="box">🎯 Reto de hoy: ${N[d.g][1]}, ${d.t} puntos ${getDone()==d.k?'✅':'(+20 🪙)'}</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px"><button class="btn" onclick="shop()">🛒 Tienda</button><button class="btn" onclick="duoSetup()">👥 2 jugadores</button></div>`;
}
function showOv(msg,btn){
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div>${msg}</div>`;
  const b=document.createElement('button');b.className='btn';b.textContent=btn;b.onclick=()=>{o.remove();paused=false};
  o.appendChild(b);stage.appendChild(o);
}
function pause(){if(stage.querySelector('.ov'))return;paused=true;showOv('Pausa','Continuar')}

async function share(text,score){
  const c=document.createElement('canvas');c.width=600;c.height=400;const q=c.getContext('2d'),im=document.querySelector('.av');
  q.fillStyle='#1b2a41';q.fillRect(0,0,600,400);
  if(im.complete)q.drawImage(im,30,30,120,120);
  q.fillStyle='#f4c95d';q.font='bold 40px sans-serif';q.fillText('Máel Games',170,100);
  q.fillStyle='#fdf6e3';q.font='32px sans-serif';q.fillText(N[cur][1],40,230);
  q.font='bold 64px sans-serif';q.fillText(score+' puntos',40,310);
  const msg=`${text}. ${score} puntos en ${N[cur][1]} (Máel Games)`;
  try{
    const b=await new Promise(r=>c.toBlob(r)),f=new File([b],'puntuacion.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:msg});return}
    if(navigator.share){await navigator.share({text:msg});return}
  }catch(e){if(e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(msg));
}

  const dd=daily();if(cur==dd.g&&score>=dd.t&&getDone()!=dd.k){setDone(dd.k);addC(20);toast('🎯 Reto cumplido +20 🪙')}

  else seq([[300,.2,0],[220,.2,200],[150,.45,400]],'sawtooth');
  const b=getBest(cur);if(score>b)setBest(cur,score);
  const o=document.createElement('div');o.className='ov';

}

  c.style.width=`min(100%,calc((100dvh - 150px)*${w/h}))`;

/* Pisa la caca */
G.caca=()=>{
  stage.innerHTML='<div class="grid" id="g"></div>';
  const cells=[];let score=0,t=30,at=-1,kd=0,hold,done=false;
  for(let i=0;i<9;i++){
    const c=document.createElement('button');c.className='hole';c.textContent='🕳️';
    c.onpointerdown=()=>hit(i);$('#g').appendChild(c);cells.push(c);
  }
  const show=()=>info(`Puntos ${score}   Tiempo ${t}`);
  function pop(){
    cells.forEach(c=>{c.textContent='🕳️';c.className='hole'});
    let n;do{n=Math.random()*9|0}while(n===at);
    at=n;kd=Math.random();kd=kd<.12?1:kd<.27?2:0;snd(700,.04,'sine',.06);cells[n].textContent=kd==2?'💣':'💩';if(kd==1)cells[n].className='hole gold';
    hold=setTimeout(pop,Math.max(420,900-score*15)/dm());
  }
  function hit(i){
    if(done||paused||i!==at)return;
    if(kd==2){score=Math.max(0,score-3);snd(120,.3,'sawtooth',.25,50);vib(200)}else{score+=kd==1?5:1;snd(kd==1?900:320,.15,'sawtooth',.2,kd==1?1400:90);vib(30)}cells[i].textContent='💥';at=-1;
    clearTimeout(hold);hold=setTimeout(pop,200);show();
  }
  const tm=setInterval(()=>{
    if(paused)return;t--;show();
    if(t<=0){done=true;clearInterval(tm);clearTimeout(hold);finish(`Fin. Pisaste ${score} cacas`,score)}
  },1000);
  stopFn=()=>{clearInterval(tm);clearTimeout(hold)};
  show();pop();
};

/* Salta la rana */
G.rana=()=>{
  const cv=mkCanvas(360,480),x=cv.getContext('2d'),gy=400;
  let y=0,vy=0,obs=[],co=[],face=document.querySelector('.av'),sc=0,nx=1,over=false,last=performance.now(),raf;
  const jump=()=>{if(y===0&&!over){vy=640;snd(300,.15,'square',.12,700)}};
  cv.onpointerdown=jump;
  const kd=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}};
  addEventListener('keydown',kd);
  function loop(n){
    const dt=Math.min(.03,(n-last)/1000);last=n;if(paused){raf=requestAnimationFrame(loop);return}
    const sp=Math.min(440,220+sc*2)*dm();
    vy-=1800*dt;y+=vy*dt;if(y<=0){y=0;vy=0}
    nx-=dt;
    if(nx<=0){obs.push(sc>50&&Math.random()<.3?{x:370,w:30,h:0,b:1}:{x:370,w:24+Math.random()*24,h:30+Math.random()*26});nx=(sp*.75+120+Math.random()*200)/sp;if(Math.random()<.6)co.push({x:370+sp*nx/2})}
    obs.forEach(o=>o.x-=sp*dt);co.forEach(c=>{c.x-=sp*dt;if(!c.t&&Math.abs(65-c.x)<24&&y<35){c.t=1;sc+=10;addC(1);snd(1000,.1,'square',.1,1500)}});co=co.filter(c=>c.x>-20&&!c.t);
    obs=obs.filter(o=>o.x+o.w>-10);
    sc+=dt*10;
    for(const o of obs){if(74>o.x+4&&56<o.x+o.w-4&&(o.b?(y+36>44&&y<72):y<o.h-8))over=true}
    x.fillStyle='#7cc6e8';x.fillRect(0,0,360,gy);x.fillStyle='#ffffffaa';for(let i=0;i<3;i++){const q=((i*150-sc*6)%450+450)%450-60;x.fillRect(q,60+i*40,70,16);x.fillRect(q+14,48+i*40,40,14)}
    x.fillStyle='#4caf6a';x.fillRect(0,gy,360,80);
    x.fillStyle='#2e7d4a';x.fillRect(0,gy,360,8);
    obs.forEach(o=>{if(o.b){x.font='30px serif';x.fillText('🦅',o.x,gy-44);return}x.fillStyle='#78350f';x.fillRect(o.x,gy-o.h,o.w,o.h);x.fillStyle='#b9770e';x.fillRect(o.x,gy-o.h,o.w,6)});
    co.forEach(c=>{x.font='22px serif';x.fillText('🪙',c.x-11,gy-10)});const sk=skin();if(sk=='face'&&face.complete)x.drawImage(face,46,gy-y-36,36,36);else{x.font='36px serif';x.fillText(sk=='face'?'🐸':sk,46,gy-y)}
    info(`Puntos ${sc|0}`);
    if(over){vib(250);finish(`Choque. Hiciste ${sc|0} puntos`,sc|0,false);return}
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  stopFn=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd)};
};

/* Fútbol: penaltis con portero */
G.futbol=()=>{
  let goals=0,shot=0,busy=false,tm,raf,gp=[0,0],kp=.5,kd=1,last=performance.now(),sx=0,pd=false;
  stage.style.touchAction='none';
  stage.innerHTML='<div class="goal" id="goal" style="position:relative;height:150px"></div><div id="ball" style="font-size:48px;margin-top:40px;text-align:center">⚽</div><div class="msg" id="msg"></div>';
  const goal=$('#goal'),ball=$('#ball'),kpEl=document.createElement('div');
  kpEl.style.cssText='position:absolute;bottom:0;font-size:44px;line-height:1';kpEl.textContent='🧤';goal.appendChild(kpEl);
  const msgT=()=>duo?'Desliza para chutar, '+duo.n[shot%2]:'Desliza el dedo hacia la portería';
  const upd=()=>duo?info(`${duo.n[0]} ${gp[0]}-${gp[1]} ${duo.n[1]}   Tiro ${Math.min(shot+1,10)} de 10`):info(`Goles ${goals}   Tiro ${Math.min(shot+1,5)} de 5`);
  $('#msg').textContent=msgT();
  function loop(n){
    const dt=Math.min(.05,(n-last)/1000);last=n;
    if(!paused){kp+=kd*dt*[.6,.9,1.3][lvl];if(kp>1){kp=1;kd=-1}if(kp<0){kp=0;kd=1}}
    kpEl.style.left=kp*(goal.clientWidth-44)+'px';
    raf=requestAnimationFrame(loop);
  }
  function shoot(ax){
    if(busy||paused)return;busy=true;shot++;snd(150,.12,'triangle',.3,60);
    const W=goal.clientWidth;
    ball.style.transition='transform .4s';ball.style.transform=`translate(${(ax-.5)*W}px,-210px) scale(.6)`;
    tm=setTimeout(()=>{
      const saved=Math.abs(kp*(W-44)+22-ax*W)<42;
      if(saved){$('#msg').textContent='¡Parada!';snd(220,.35,'sawtooth',.15,100)}
      else{goals++;if(duo)gp[(shot-1)%2]++;vib(150);$('#msg').textContent='¡Gol!';seq([[523,.12,0],[659,.12,120],[784,.3,240]])}
      upd();
      tm=setTimeout(()=>{
        ball.style.transition='none';ball.style.transform='none';
        if(duo&&shot>=10)duoEnd(gp);
        else if(!duo&&shot>=5)finish(`Marcaste ${goals} de 5`,goals,goals>=3);
        else{busy=false;$('#msg').textContent=msgT();upd()}
      },1000);
    },420);
  }
  stage.onpointerdown=e=>{sx=e.clientX;pd=true};
  stage.onpointerup=e=>{
    if(!pd)return;pd=false;
    const r=goal.getBoundingClientRect();
    shoot(Math.max(.04,Math.min(.96,.5+(e.clientX-sx)/(r.width*.7))));
  };
  stopFn=()=>{cancelAnimationFrame(raf);clearTimeout(tm);stage.onpointerdown=stage.onpointerup=null;stage.style.touchAction=''};
  upd();raf=requestAnimationFrame(loop);
};

/* Tenis */
G.tenis=()=>tenis(false);G.tenis2=()=>tenis(true);
const tenis=two=>{
  const W=360,H=520,PW=72,cv=mkCanvas(W,H),x=cv.getContext('2d');
  let px=W/2,cx=W/2,ps=0,cs=0,pause=1,b,last=performance.now(),raf;
  const serve=d=>{b={x:W/2,y:H/2,vx:Math.random()*120-60,vy:d*260,s:260};pause=.9};
  serve(1);
  cv.onpointermove=cv.onpointerdown=e=>{
    const r=cv.getBoundingClientRect();
    const X=Math.max(PW/2,Math.min(W-PW/2,(e.clientX-r.left)*W/r.width));if(two&&(e.clientY-r.top)<r.height/2)cx=X;else px=X;
  };
  const hit=(p,d)=>{
    const o=Math.max(-1,Math.min(1,(b.x-p)/(PW/2)));
    snd(520,.07,'square',.12);b.s=Math.min(560,b.s*1.06);b.vx=o*b.s*.8;b.vy=d*Math.sqrt(b.s*b.s-b.vx*b.vx);
  };
  function loop(n){
    const dt=Math.min(.03,(n-last)/1000);last=n;if(paused){raf=requestAnimationFrame(loop);return}
    if(pause>0)pause-=dt;
    else{
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<7){b.x=7;b.vx=Math.abs(b.vx);snd(300,.04,'square',.08)}
      if(b.x>W-7){b.x=W-7;b.vx=-Math.abs(b.vx);snd(300,.04,'square',.08)}
      if(b.vy>0&&b.y>=H-38&&b.y<=H-20&&Math.abs(b.x-px)<PW/2+7){b.y=H-39;hit(px,-1)}

/* Tres en raya */
G.tres=()=>{
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let B=Array(9).fill(''),over=false,tm,dt=0;
  stage.innerHTML='<div class="grid" id="g"></div>';
  const cs=B.map((_,i)=>{const b=document.createElement('button');b.className='hole';b.onclick=()=>mv(i);$('#g').appendChild(b);return b});
  const win=p=>L.some(l=>l.every(i=>B[i]==p));
  const draw=()=>cs.forEach((c,i)=>c.textContent=B[i]=='X'?'❌':B[i]=='O'?'⭕':'');
  const end=(t,sc,ok)=>{over=true;tm=setTimeout(()=>finish(t,sc,ok),600)};
  function mv(i){
    if(duo){
      if(over||B[i])return;
      const sy=dt?'O':'X';B[i]=sy;snd(500,.08);draw();
      if(win(sy)){over=true;tm=setTimeout(()=>duoEnd(dt?[0,1]:[1,0]),600);return}
      if(!B.includes('')){over=true;tm=setTimeout(()=>duoEnd([0,0]),600);return}
      dt=1-dt;info(`Turno de ${duo.n[dt]} (${dt?'⭕':'❌'})`);return;
    }
    if(over||B[i])return;
    B[i]='X';snd(500,.08);draw();
    if(win('X'))return end('¡Ganas!',1,true);
    if(!B.includes(''))return end('Empate',0,false);
    tm=setTimeout(()=>{
      const f=p=>{for(const l of L){const v=l.map(k=>B[k]);if(v.filter(c=>c==p).length==2&&v.includes(''))return l[v.indexOf('')]}};
      const dumb=Math.random()<[.4,.1,0][lvl];let m=null;if(!dumb){m=f('O');if(m==null)m=f('X');if(m==null)m=B[4]?null:4}
      if(m==null){const e=B.map((c,k)=>c?-1:k).filter(k=>k>=0);m=e[Math.random()*e.length|0]}
      B[m]='O';snd(380,.08);draw();
      if(win('O'))return end('Gana la CPU',0,false);
      if(!B.includes(''))end('Empate',0,false);
    },400);
  }
  stopFn=()=>clearTimeout(tm);info(duo?`Turno de ${duo.n[0]} (❌)`:'Tú eres ❌');

/* Pájaro volador */
G.flappy=()=>{
  const cv=mkCanvas(360,480),x=cv.getContext('2d'),face=document.querySelector('.av');
  let y=220,vy=0,P=[],nx=.5,sc=0,over=false,last=performance.now(),raf;

  cv.onpointerdown=fl;
  const kd=e=>{if(e.code==='Space'){e.preventDefault();fl()}};addEventListener('keydown',kd);
  function loop(n){
    const dt=Math.min(.03,(n-last)/1000);last=n;
    if(paused){raf=requestAnimationFrame(loop);return}
    const sp=140*dm(),gap=[165,150,135][lvl];
    vy+=1300*dt;y+=vy*dt;
    nx-=dt;if(nx<=0){P.push({x:370,t:60+Math.random()*(360-gap)});nx=1.7/dm()}
    P.forEach(p=>{p.x-=sp*dt;if(!p.s&&p.x+50<60){p.s=1;sc++;snd(880,.08,'square',.1)}});

    if(y>448||y<-20)over=true;
    x.fillStyle='#7cc6e8';x.fillRect(0,0,360,480);
    x.fillStyle='#2f7d4f';P.forEach(p=>{x.fillRect(p.x,0,50,p.t);x.fillRect(p.x,p.t+gap,50,480-p.t-gap)});

};

/* Serpiente */
G.serpiente=()=>{
  const cv=mkCanvas(360,480),x=cv.getContext('2d'),face=document.querySelector('.av'),C=24,COLS=15,ROWS=20;
  let s=[{x:7,y:10},{x:6,y:10},{x:5,y:10}],d={x:1,y:0},nd=d,f,sc=0,acc=0,over=false,last=performance.now(),raf,sx=0,sy=0,pd=false;
  const food=()=>{do{f={x:Math.random()*COLS|0,y:Math.random()*ROWS|0}}while(s.some(p=>p.x==f.x&&p.y==f.y))};
  const turn=(dx,dy)=>{if(!(dx==-d.x&&dy==-d.y))nd={x:dx,y:dy}};
  food();
  cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;pd=true};
  cv.onpointermove=e=>{
    if(!pd)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
    sx=e.clientX;sy=e.clientY;
  };
  cv.onpointerup=()=>pd=false;
  const kd=e=>{
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],KeyA:[-1,0],KeyD:[1,0],KeyW:[0,-1],KeyS:[0,1]}[e.code];
    if(m){e.preventDefault();turn(m[0],m[1])}
  };
  addEventListener('keydown',kd);
  function loop(n){
    const dt=Math.min(.05,(n-last)/1000);last=n;
    if(paused){raf=requestAnimationFrame(loop);return}
    const st=Math.max(.07,[.2,.15,.11][lvl]-sc*.003);
    acc+=dt;
    while(acc>=st&&!over){
      acc-=st;d=nd;
      const h={x:s[0].x+d.x,y:s[0].y+d.y};
      if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||s.some(p=>p.x==h.x&&p.y==h.y))over=true;
      else{s.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;snd(880,.08,'square',.1,1200);food()}else s.pop()}
    }
    x.fillStyle='#1f5d39';x.fillRect(0,0,360,480);
    x.fillStyle='#276b44';for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++)if((i+j)%2)x.fillRect(i*C,j*C,C,C);
    x.font='20px serif';x.fillText('🍎',f.x*C+2,f.y*C+20);
    s.forEach((p,i)=>{x.fillStyle='#f4c95d';x.fillRect(p.x*C+1,p.y*C+1,C-2,C-2)});
    const sk=skin(),h0=s[0];
    if(sk=='face'&&face.complete)x.drawImage(face,h0.x*C,h0.y*C,C,C);else x.fillText(sk=='face'?'🐍':sk,h0.x*C+1,h0.y*C+20);
    info(`Puntos ${sc}`);
    if(over){vib(250);finish(`Fin. Comiste ${sc} manzanas`,sc,false);return}
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  stopFn=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd)};
};
